        patient_search: "नाम / फोन द्वारा मरीज़ रिकॉर्ड खोजें",
        search_placeholder: "मरीज़ का नाम या फोन नंबर लिखें...",
        live_metrics: "लाइव एनालिटिक्स डैशबोर्ड",
        total_docs: "कुल रिपोर्ट",
        pending_review: "समीक्षा लंबित",
        insurance_applied: "बीमा दावे",
        missing_info_count: "अधूरी फ़ील्ड",
        avg_completeness: "औसत पूर्णता",
        doc_registry: "अपलोड किए गए दस्तावेज़ों की सूची",
        book_token: "अपॉइंटमेंट बुक करें / टोकन जनरेट करें",
        doctor_select: "डॉक्टर चुनें",
        app_date: "अपॉइंटमेंट तिथि",
        app_time: "पसंदीदा समय",
        symptoms: "लक्षण / यात्रा का कारण",
        btn_generate_token: "अपॉइंटमेंट टोकन जनरेट करें 🎟️",
        token_success: "अपॉइंटमेंट टोकन सफलतापूर्वक जनरेट हुआ!",
        email_notifications: "📩 नोटिफिकेशन और अलर्ट इनबॉक्स",
        insurance_workflow: "रिसेप्शनिस्ट बीमा और अधूरे दस्तावेज़ प्रबंधक"
      }
    };

    function App() {
      const [currentRole, setCurrentRole] = useState("login");
      const [loggedUser, setLoggedUser] = useState("");
      const [userEmail, setUserEmail] = useState("");
      const [authTab, setAuthTab] = useState("signin");

      // Role Auth States
      const [patientEmail, setPatientEmail] = useState("patient@mamacare.org");
      const [patientPass, setPatientPass] = useState("password123");

      const [docEmail, setDocEmail] = useState("doctor@mamacare.org");
      const [docPass, setDocPass] = useState("password123");

      const [recEmail, setRecEmail] = useState("reception@mamacare.org");
      const [recPass, setRecPass] = useState("password123");

      // Isolated Sign Up States
      const [patientRegName, setPatientRegName] = useState("");
      const [patientRegEmail, setPatientRegEmail] = useState("");
      const [patientRegPass, setPatientRegPass] = useState("");

      const [docRegName, setDocRegName] = useState("");
      const [docRegEmail, setDocRegEmail] = useState("");
      const [docRegPass, setDocRegPass] = useState("");

      const [recRegName, setRecRegName] = useState("");
      const [recRegEmail, setRecRegEmail] = useState("");
      const [recRegPass, setRecRegPass] = useState("");

      const [authError, setAuthError] = useState("");
      const [authSuccess, setAuthSuccess] = useState("");

      // Supported Languages: English, Hindi, Bengali, Tamil, Marathi, Gujarati
      const [selectedLanguage, setSelectedLanguage] = useState("English");

      const t = (key) => (dict[selectedLanguage] || dict.English)[key] || (dict.English[key] || key);

      // Patient Portal States
      const [selectedFile, setSelectedFile] = useState(null);
      const [uploading, setUploading] = useState(false);
      const [uploadError, setUploadError] = useState("");
      const [extractionResult, setExtractionResult] = useState(null);
      const [patientHistory, setPatientHistory] = useState([]);
      const [notifications, setNotifications] = useState([]);

      // Appointment Token States & Errors
      const [tokenDoctor, setTokenDoctor] = useState("Dr. Arvind Sharma (MBBS)");
      const [tokenDate, setTokenDate] = useState("2026-08-02");
      const [tokenTime, setTokenTime] = useState("10:30 AM");
      const [tokenReason, setTokenReason] = useState("Routine Health Checkup & Blood Test Review");
      const [generatedToken, setGeneratedToken] = useState(null);
      const [tokenError, setTokenError] = useState("");
      const [appointmentsList, setAppointmentsList] = useState([]);

      // Doctor Patient Search State
      const [searchQuery, setSearchQuery] = useState("");
      const [searchResults, setSearchResults] = useState([]);

      // Receptionist Portal States
      const [recFile, setRecFile] = useState(null);
      const [recPatientName, setRecPatientName] = useState("Rahul Sharma");
      const [recUploading, setRecUploading] = useState(false);
      const [recUploadSuccess, setRecUploadSuccess] = useState("");
      const [notifTargetPatient, setNotifTargetPatient] = useState("Rahul Sharma");
      const [notifMissingFields, setNotifMissingFields] = useState("insurance_number, emergency_contact, blood_group");
      const [notifSentSuccess, setNotifSentSuccess] = useState("");

      // Analytics States
      const [analytics, setAnalytics] = useState({ total: 0, pending: 0, missing: 0, avg_completeness: 0 });
      const [documents, setDocuments] = useState([]);
      const [followupPatient, setFollowupPatient] = useState("Rahul Sharma");

      // Prescription States
      const [prescriptionText, setPrescriptionText] = useState("1. Cholecalciferol (Vitamin D3) 60k IU - Once weekly for 8 weeks\n2. Cetirizine 10mg - Once daily at bedtime");
      const [diagnosisText, setDiagnosisText] = useState("Mild Vitamin D Deficiency, Seasonal Allergies");
      const [prescriptionSuccess, setPrescriptionSuccess] = useState(false);

      useEffect(() => {
        fetchAppointments();
        if (currentRole === "receptionist") {
          fetchAnalytics();
          fetchDocs();
        }
      }, [currentRole]);

      useEffect(() => {
        if (currentRole === "patient" && loggedUser) {
          fetchPatientHistory(loggedUser);
          fetchNotifications(loggedUser);
        }
      }, [currentRole, loggedUser]);

      const fetchAnalytics = () => {
        fetch(`${API_BASE}/analytics`)
          .then(res => res.json())
          .then(data => setAnalytics(data))
          .catch(err => console.log("Analytics offline:", err));
      };

      const fetchDocs = () => {
        fetch(`${API_BASE}/documents`)
          .then(res => res.json())
          .then(data => setDocuments(data))
          .catch(err => console.log("Docs offline:", err));
      };

      const fetchAppointments = () => {
        fetch(`${API_BASE}/appointments`)
          .then(res => res.json())
          .then(data => setAppointmentsList(data))
          .catch(err => console.log("Appointments offline:", err));
      };

      const fetchPatientHistory = (name) => {
        fetch(`${API_BASE}/auth/patient-history/${encodeURIComponent(name)}`)
          .then(res => res.json())
          .then(data => setPatientHistory(data))
          .catch(err => console.log("History offline:", err));
      };

      const fetchNotifications = (name) => {
        fetch(`${API_BASE}/notifications/${encodeURIComponent(name)}`)
          .then(res => res.json())
          .then(data => setNotifications(data))
          .catch(err => console.log("Notifications offline:", err));
      };

      const handlePatientSearch = async (query) => {
        setSearchQuery(query);
        try {
          const res = await fetch(`${API_BASE}/patients/search?q=${encodeURIComponent(query)}`);
          const data = await res.json();
          setSearchResults(data);
        } catch (err) {
          console.error("Search error:", err);
        }
      };

      const handleRegister = async (role) => {
        setAuthError("");
        setAuthSuccess("");

        let nameVal = role === "patient" ? patientRegName : role === "doctor" ? docRegName : recRegName;
        let emailVal = role === "patient" ? patientRegEmail : role === "doctor" ? docRegEmail : recRegEmail;
        let passVal = role === "patient" ? patientRegPass : role === "doctor" ? docRegPass : recRegPass;

        if (!nameVal || !emailVal || !passVal) {
          setAuthError("Please enter Name, Email, and Password!");
          return;
        }

        try {
          const res = await fetch(`${API_BASE}/auth/register`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name: nameVal, email: emailVal, password: passVal, role: role })
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || "Registration failed");

          setAuthSuccess("Account registered successfully in SQLite Database! Please Sign In now.");
          setAuthTab("signin");
          if (role === "patient") { setPatientEmail(emailVal); setPatientPass(passVal); }
          else if (role === "doctor") { setDocEmail(emailVal); setDocPass(passVal); }
          else { setRecEmail(emailVal); setRecPass(passVal); }
        } catch (err) {
          setAuthError(err.message);
        }
      };

      const handleLogin = async (role, emailVal, passVal) => {
        setAuthError("");
        setAuthSuccess("");
        if (!emailVal || !passVal) {
          setAuthError("Please enter Email and Password!");
          return;
        }

        try {
          const res = await fetch(`${API_BASE}/auth/login`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email: emailVal, password: passVal, role: role })
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || "Invalid Credentials");

          setLoggedUser(data.user.name);
          setUserEmail(data.user.email);
          setCurrentRole(role);
        } catch (err) {
          setAuthError(err.message || "Invalid Credentials! Account not registered. Please Sign Up first.");
        }
      };

      // STRICT TOKEN GENERATION (Prevents Duplicate Active Tokens for same patient & doctor)
      const handleCreateToken = async (pName) => {
        setTokenError("");
        setGeneratedToken(null);
        try {
          const res = await fetch(`${API_BASE}/appointments/create`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              patient_name: pName || loggedUser || "Rahul Sharma",
              doctor_name: tokenDoctor,
              appointment_date: tokenDate,
              appointment_time: tokenTime,
              reason: tokenReason
            })
          });
          const data = await res.json();
          if (!res.ok) {
            setTokenError(data.error || "Token generation failed.");
            return;
          }

          setGeneratedToken(data.appointment);
          fetchAppointments();
        } catch (err) {
          setTokenError("Failed to communicate with server.");
        }
      };

      // Receptionist Direct PDF Upload
      const handleReceptionistUpload = async (e) => {
        e.preventDefault();
        if (!recFile) return;
        setRecUploading(true);
        setRecUploadSuccess("");

        try {
          const formData = new FormData();
          formData.append("file", recFile);
          formData.append("patient_name", recPatientName);

          const uploadRes = await fetch(`${API_BASE}/upload`, { method: "POST", body: formData });
          const uploadData = await uploadRes.json();

          await fetch(`${API_BASE}/extract`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              document_id: uploadData.document_id,
              filename: uploadData.filename,
              file_type: uploadData.file_type,
              patient_name: recPatientName,
              language: selectedLanguage
            })
          });

          setRecUploadSuccess(`PDF '${recFile.name}' uploaded and processed for patient ${recPatientName}!`);
          setRecFile(null);
          fetchDocs();
          fetchAnalytics();
        } catch (err) {
          console.error("Receptionist upload error:", err);
        } finally {
          setRecUploading(false);
        }
      };

      // Receptionist Send Missing Information Email Notification to Patient
      const handleSendMissingNotif = async () => {
        setNotifSentSuccess("");
        try {
          const res = await fetch(`${API_BASE}/notifications/send`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              patient_name: notifTargetPatient,
              title: "Action Required: Missing Information in Submitted File",
              message: `Dear ${notifTargetPatient}, the Receptionist Desk requires missing details from you: ${notifMissingFields}. Please submit these details at the desk or upload them to your portal.`,
              missing_fields: notifMissingFields
            })
          });
          if (res.ok) {
            setNotifSentSuccess(`Email Notification Alert successfully sent to patient '${notifTargetPatient}' inbox!`);
            setTimeout(() => setNotifSentSuccess(""), 5000);
          }
        } catch (err) {
          console.error("Send notification error:", err);
        }
      };

      const handleRealUpload = async (e) => {
        e.preventDefault();
        if (!selectedFile) {
          setUploadError("Please select a file first!");
          return;
        }
        setUploadError("");
        setUploading(true);
        setExtractionResult(null);

        try {
          const formData = new FormData();
          formData.append("file", selectedFile);
          formData.append("patient_name", loggedUser || "Rahul Sharma");

          const uploadRes = await fetch(`${API_BASE}/upload`, { method: "POST", body: formData });
          if (!uploadRes.ok) throw new Error("Upload failed");
          const uploadData = await uploadRes.json();

          const extractRes = await fetch(`${API_BASE}/extract`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              document_id: uploadData.document_id,
              filename: uploadData.filename,
              file_type: uploadData.file_type,
              patient_name: loggedUser || "Rahul Sharma",
              language: selectedLanguage
            })
          });
          if (!extractRes.ok) throw new Error("Extraction failed");
          const extractData = await extractRes.json();
          setExtractionResult(extractData);

          fetchPatientHistory(loggedUser || "Rahul Sharma");
          fetchNotifications(loggedUser || "Rahul Sharma");

        } catch (err) {
          setUploadError(err.message || "Upload process failed");
        } finally {
          setUploading(false);
        }
      };

      const handleUpdateAppointmentStatus = async (appId, newStatus) => {
        try {
          await fetch(`${API_BASE}/appointments/${appId}/status`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ status: newStatus })
          });
          fetchAppointments();
        } catch (err) {
          console.error("Status update error:", err);
        }
      };

      const handleLogout = () => {
        setCurrentRole("login");
        setLoggedUser("");
        setSelectedFile(null);
        setExtractionResult(null);
        setGeneratedToken(null);
        setTokenError("");
        setAuthError("");
        setAuthSuccess("");
      };

      // UNIFIED BRAND LOGO HEADER COMPONENT
      const BrandHeader = ({ roleName, badgeColor }) => (
        <header className="bg-white border-b border-gray-200 px-8 py-3.5 flex items-center justify-between sticky top-0 z-50 shadow-sm">
          <div className="flex items-center gap-3">
            <div className="w-10 h-10 bg-gradient-to-tr from-blue-700 via-indigo-600 to-rose-600 rounded-2xl flex items-center justify-center shadow-md">
              <svg className="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M12 4v16m8-8H4" />
              </svg>
            </div>
            <div>
              <span className="font-black text-gray-900 text-lg tracking-tight block leading-none">{t("title")}</span>
              <span className="text-[10px] text-gray-400 font-bold uppercase tracking-widest">{t("tagline")}</span>
            </div>
            {roleName && <span className={`text-[11px] font-extrabold px-3 py-1 rounded-full ${badgeColor}`}>{roleName}</span>}
          </div>

                                <span className="font-bold text-gray-800">{h.filename}</span>
                                <span className="text-[10px] bg-blue-600 text-white font-extrabold px-2 py-0.5 rounded-full">{h.document_type || "Medical Report"}</span>
                              </div>
                              <span className="text-[10px] bg-emerald-100 text-emerald-800 font-bold px-2 py-0.5 rounded-full">Score: {h.completeness_score}%</span>
                            </div>
                            <p className="text-[10px] text-gray-400">Uploaded: {h.uploaded_at} | Status: {h.status}</p>
                          </div>
                        ))
                      )}
                    </div>
                  </div>

                </div>
              </main>
            </div>
          )}


          {/* ==================== DOCTOR DASHBOARD ==================== */}
          {currentRole === "doctor" && (
            <div className="flex-1 flex flex-col">
              <BrandHeader roleName={t("doctor_desk").toUpperCase()} badgeColor="bg-blue-100 text-blue-800" />
              
              <main className="flex-1 p-8 max-w-6xl mx-auto w-full">
                <div className="flex items-center justify-between mb-8">
                  <div>
                    <h1 className="text-2xl font-bold text-gray-900">{t("welcome")}, {loggedUser} 🩺</h1>
                    <p className="text-xs text-gray-500">{t("opd_queue")}</p>
                  </div>
                  <button onClick={fetchAppointments} className="bg-blue-50 text-blue-700 text-xs font-bold px-3.5 py-1.5 rounded-xl border border-blue-200">
                    🔄 Refresh Live Tokens Queue
                  </button>
                </div>

                {/* DOCTOR PATIENT HISTORY SEARCH BAR */}
                <div className="bg-white p-6 rounded-3xl border border-gray-100 shadow-sm mb-8">
                  <h2 className="font-bold text-gray-800 text-sm mb-3 flex items-center gap-2">
                    <span>🔍</span> {t("patient_search")}
                  </h2>
                  <div className="flex gap-3">
                    <input
                      type="text"
                      placeholder={t("search_placeholder")}
                      value={searchQuery}
                      onChange={e => handlePatientSearch(e.target.value)}
                      className="flex-1 border border-gray-200 rounded-xl p-3 text-xs font-medium focus:outline-none focus:border-blue-500"
                    />
                    <button onClick={() => handlePatientSearch(searchQuery)} className="bg-blue-600 text-white font-bold px-5 py-3 rounded-xl text-xs hover:bg-blue-700">
                      Search Patient DB
                    </button>
                  </div>

                  {searchResults.length > 0 && (
                    <div className="mt-4 p-4 bg-slate-50 border border-slate-200 rounded-2xl space-y-2 text-xs">
                      <p className="font-bold text-gray-700 uppercase text-[10px]">Found {searchResults.length} Patient Records:</p>
                      <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                        {searchResults.map(p => (
                          <div key={p.id} className="p-3 bg-white border border-gray-200 rounded-xl flex items-center justify-between">
                            <div>
                              <p className="font-bold text-gray-800">{p.name}</p>
                              <p className="text-[10px] text-gray-400">{p.email} | {p.phone || "No phone"}</p>
                            </div>
                            <button onClick={() => fetchPatientHistory(p.name)} className="bg-blue-50 text-blue-700 font-bold px-3 py-1 rounded-lg text-[11px] border border-blue-200">
                              View History
                            </button>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}
                </div>

                <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                  
                  {/* LIVE APPOINTMENTS TOKEN QUEUE */}
                  <div className="bg-white p-6 rounded-3xl border border-gray-100 shadow-sm col-span-1">
                    <h2 className="font-bold text-gray-800 text-sm mb-4 flex items-center justify-between">
                      <span>{t("token_queue")}</span>
                      <span className="text-[10px] bg-blue-100 text-blue-800 font-bold px-2 py-0.5 rounded-full">{appointmentsList.length} Live</span>
                    </h2>

                    <div className="space-y-3 text-xs max-h-96 overflow-y-auto pr-1">
                      {appointmentsList.length === 0 ? (
                        <p className="text-xs text-gray-400 italic">No live appointment tokens found. Book a token from Patient or Receptionist portal.</p>
                      ) : (
                        appointmentsList.map((p, i) => (
                          <div key={i} className={`p-4 rounded-2xl border space-y-2 ${p.status === "In Consultation" ? "border-blue-300 bg-blue-50/80 shadow-sm" : p.status === "Completed" ? "border-emerald-200 bg-emerald-50/40 opacity-75" : "border-gray-100 bg-white"}`}>
                            <div className="flex items-center justify-between">
                              <span className="font-extrabold text-blue-600 text-base">{p.token_no}</span>
                              <span className={`text-[10px] font-extrabold px-2 py-0.5 rounded-full ${p.status === "In Consultation" ? "bg-blue-600 text-white" : p.status === "Completed" ? "bg-emerald-600 text-white" : "bg-gray-100 text-gray-600"}`}>{p.status}</span>
                            </div>
                            <div>
                              <p className="font-bold text-gray-800">{p.patient_name}</p>
                              <p className="text-[10px] text-gray-400">{p.appointment_date} at {p.appointment_time}</p>
                              <p className="text-[11px] text-gray-600 font-medium italic mt-1">"{p.reason}"</p>
                            </div>

                            {p.status !== "Completed" && (
                              <div className="flex gap-2 mt-2">
                                {p.status !== "In Consultation" && (
                                  <button onClick={() => handleUpdateAppointmentStatus(p.id, "In Consultation")} className="bg-blue-600 text-white text-[10px] font-bold px-3 py-1 rounded-lg hover:bg-blue-700">
                                    Start Consultation
                                  </button>
                                )}
                                <button onClick={() => handleUpdateAppointmentStatus(p.id, "Completed")} className="bg-emerald-600 text-white text-[10px] font-bold px-3 py-1 rounded-lg hover:bg-emerald-700">
                                  Mark Completed
                                </button>
                              </div>
                            )}
                          </div>
                        ))
                      )}
                    </div>
                  </div>

                  {/* Prescription Writer */}
                  <div className="bg-white p-6 rounded-3xl border border-gray-100 shadow-sm col-span-2">
                    <h2 className="font-bold text-gray-800 text-sm mb-4">{t("write_prescription")} (Rahul Sharma)</h2>
                    <div className="space-y-4 text-xs">
                      <div>
                        <label className="block text-gray-600 font-bold mb-1">{t("diagnosis")}</label>
                        <input
                          type="text"
                          value={diagnosisText}
                          onChange={e => setDiagnosisText(e.target.value)}
                          className="w-full border border-gray-200 rounded-xl p-3 focus:outline-none focus:border-blue-500 font-medium"
                        />
                      </div>
                      <div>
                        <label className="block text-gray-600 font-bold mb-1">{t("medicines")}</label>
                        <textarea
                          rows="4"
                          value={prescriptionText}
                          onChange={e => setPrescriptionText(e.target.value)}
                          className="w-full border border-gray-200 rounded-xl p-3 focus:outline-none focus:border-blue-500 font-medium font-mono text-xs"
                        ></textarea>
                      </div>

                      {prescriptionSuccess && (
                        <div className="p-3 bg-emerald-50 border border-emerald-200 rounded-xl text-xs text-emerald-800 font-bold">
                          ✅ {t("prescription_saved")}
                        </div>
                      )}

                      <button
                        onClick={() => {
                          setPrescriptionSuccess(true);
                          setTimeout(() => setPrescriptionSuccess(false), 4000);
                        }}
                        className="bg-blue-600 hover:bg-blue-700 text-white font-bold px-6 py-3 rounded-xl text-xs shadow-md transition-colors"
                      >
                        {t("btn_save_prescription")}
                      </button>
                    </div>
                  </div>

                </div>
              </main>
            </div>
          )}


          {/* ==================== RECEPTIONIST DASHBOARD ==================== */}
          {currentRole === "receptionist" && (
            <div className="flex-1 flex flex-col">
              <BrandHeader roleName={t("receptionist_desk").toUpperCase()} badgeColor="bg-indigo-100 text-indigo-800" />
              
              <main className="flex-1 p-8 max-w-6xl mx-auto w-full">
                <div className="flex items-center justify-between mb-8">
                  <div>
                    <h1 className="text-2xl font-bold text-gray-900">{t("receptionist_desk")} 📋</h1>
                    <p className="text-xs text-gray-500">{t("receptionist_desc")}</p>
                  </div>
                  <button onClick={() => { fetchAnalytics(); fetchDocs(); fetchAppointments(); }} className="bg-indigo-50 text-indigo-700 border border-indigo-200 text-xs font-bold px-3.5 py-1.5 rounded-xl hover:bg-indigo-100">
                    🔄 Refresh Metrics & DB
                  </button>
                </div>

                <div className="grid grid-cols-1 lg:grid-cols-3 gap-8 mb-8">
                  
                  {/* 1. RECEPTIONIST DIRECT PATIENT REPORT PDF UPLOAD */}
                  <div className="bg-white p-6 rounded-3xl border border-gray-100 shadow-sm space-y-3">
                    <h2 className="font-bold text-gray-800 text-sm flex items-center gap-2">
                      <span>📄</span> Receptionist PDF Report Upload
                    </h2>

                    <form onSubmit={handleReceptionistUpload} className="space-y-3 text-xs">
                      <div>
                        <label className="block text-gray-600 font-bold mb-1">Target Patient Name</label>
                        <input
                          type="text"
                          value={recPatientName}
                          onChange={e => setRecPatientName(e.target.value)}
                          className="w-full border border-gray-200 rounded-xl p-2.5 focus:outline-none"
                          placeholder="Patient Name..."
                        />
                      </div>

                      <div className="border-2 border-dashed border-gray-200 rounded-xl p-4 text-center bg-gray-50">
                        <input
                          type="file"
                          accept=".pdf,.png,.jpg,.jpeg,.txt,.docx"
                          onChange={e => setRecFile(e.target.files[0])}
                          className="w-full text-xs text-gray-500 cursor-pointer"
                        />
                      </div>

                      {recUploadSuccess && (
                        <div className="p-2.5 bg-emerald-50 border border-emerald-200 text-emerald-800 font-bold rounded-xl text-[11px]">
                          ✅ {recUploadSuccess}
                        </div>
                      )}

                      <button
                        type="submit"
                        disabled={recUploading || !recFile}
                        className="w-full bg-indigo-600 hover:bg-indigo-700 disabled:opacity-50 text-white font-bold py-2.5 rounded-xl shadow-md transition-colors"
                      >
                        {recUploading ? "Processing OCR & AI..." : "Upload & Process PDF"}
                      </button>
                    </form>
                  </div>


                  {/* 2. SEND MISSING INFO EMAIL NOTIFICATION ALERT TO PATIENT */}
                  <div className="bg-white p-6 rounded-3xl border border-gray-100 shadow-sm space-y-3">
                    <h2 className="font-bold text-gray-800 text-sm flex items-center gap-2">
                      <span>📩</span> Send Missing Info Alert to Patient
                    </h2>

                    <div className="space-y-3 text-xs">
                      <div>
                        <label className="block text-gray-600 font-bold mb-1">Target Patient</label>
                        <input
                          type="text"
                          value={notifTargetPatient}
                          onChange={e => setNotifTargetPatient(e.target.value)}
                          className="w-full border border-gray-200 rounded-xl p-2.5 focus:outline-none"
                        />
                      </div>

                      <div>
                        <label className="block text-gray-600 font-bold mb-1">Missing Documents / Fields</label>
                        <textarea
                          rows="2"
                          value={notifMissingFields}
                          onChange={e => setNotifMissingFields(e.target.value)}
                          className="w-full border border-gray-200 rounded-xl p-2.5 focus:outline-none font-medium text-xs"
                        ></textarea>
                      </div>

                      {notifSentSuccess && (
                        <div className="p-2.5 bg-emerald-50 border border-emerald-200 text-emerald-800 font-bold rounded-xl text-[11px]">
                          ✅ {notifSentSuccess}
                        </div>
                      )}

                      <button
                        onClick={handleSendMissingNotif}
                        className="w-full bg-rose-600 hover:bg-rose-700 text-white font-bold py-2.5 rounded-xl shadow-md transition-colors"
                      >
                        Send Email Notification Alert 📧
                      </button>
                    </div>
                  </div>


                  {/* 3. GENERATE TOKEN WITH DUPLICATE ACTIVE TOKEN PROTECTION */}
                  <div className="bg-white p-6 rounded-3xl border border-gray-100 shadow-sm space-y-3">
                    <h2 className="font-bold text-gray-800 text-sm flex items-center gap-2">
                      <span>🎟️</span> Generate Appointment Token
                    </h2>

                    {tokenError && (
                      <div className="p-3 bg-rose-50 border-2 border-rose-200 text-rose-800 font-bold rounded-xl text-xs">
                        ⚠️ {tokenError}
                      </div>
                    )}

                    <div className="space-y-3 text-xs">
                      <div>
                        <label className="block text-gray-600 font-bold mb-1">{t("patient_name")}</label>
                        <input type="text" value={followupPatient} onChange={e => setFollowupPatient(e.target.value)} className="w-full border border-gray-200 rounded-xl p-2.5 focus:outline-none" />
                      </div>
                      <div>
                        <label className="block text-gray-600 font-bold mb-1">{t("doctor_select")}</label>
                        <select value={tokenDoctor} onChange={e => setTokenDoctor(e.target.value)} className="w-full border border-gray-200 rounded-xl p-2.5 focus:outline-none">
                          <option>Dr. Arvind Sharma (MBBS, MD - General Physician)</option>
                          <option>Dr. Meenakshi Sundaram (Gynecologist & Obstetrics)</option>
                          <option>Dr. Rajesh Gupta (Cardiologist)</option>
                        </select>
                      </div>

                      <button onClick={() => handleCreateToken(followupPatient)} className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-xl text-xs shadow-md transition-colors">
                        {t("btn_generate_token")}
                      </button>

                      {generatedToken && (
                        <div className="p-3 bg-indigo-50 border border-indigo-200 rounded-2xl text-center space-y-1">
                          <span className="bg-indigo-600 text-white font-extrabold text-xs px-3 py-1 rounded-full inline-block">{generatedToken.token_no}</span>
                          <p className="font-bold text-gray-800 text-xs">{t("token_success")}</p>
                          <p className="text-indigo-700 text-[10px] font-bold">Token is live on Doctor's OPD Desk!</p>
                        </div>
                      )}
                    </div>
                  </div>

                </div>

                {/* Uploaded Documents Registry & Insurance Workflow Manager */}
                <div className="bg-white p-6 rounded-3xl border border-gray-100 shadow-sm">
                  <h2 className="font-bold text-gray-800 text-sm mb-4 flex items-center justify-between">
                    <span>{t("doc_registry")} & Insurance Workflow</span>
                    <span className="text-[10px] bg-indigo-100 text-indigo-800 font-bold px-2 py-0.5 rounded-full">{documents.length} Files Total</span>
                  </h2>

                  {documents.length === 0 ? (
                    <p className="text-xs text-gray-400 italic">No uploaded documents found in database. Upload a file above to test live DB tracking.</p>
                  ) : (
                    <table className="w-full text-xs">
                      <thead>
                        <tr className="text-gray-400 border-b text-left">
                          <th className="pb-2 font-bold">ID</th>
                          <th className="pb-2 font-bold">{t("patient_name")}</th>
                          <th className="pb-2 font-bold">Filename</th>
                          <th className="pb-2 font-bold">Classification</th>
                          <th className="pb-2 font-bold">Status</th>
                          <th className="pb-2 font-bold">Score</th>
                        </tr>
                      </thead>
                      <tbody>
                        {documents.map(d => (
                          <tr key={d.id} className="border-b last:border-0">
                            <td className="py-2.5 font-bold text-gray-500">#{d.id}</td>
                            <td className="py-2.5 font-bold text-gray-800">{d.patient_name}</td>
                            <td className="py-2.5 text-gray-600">{d.filename}</td>
                            <td className="py-2.5"><span className="bg-blue-600 text-white font-extrabold text-[10px] px-2 py-0.5 rounded-full">{d.document_type || "Blood Test"}</span></td>
                            <td className="py-2.5"><span className="bg-amber-100 text-amber-800 text-[10px] font-bold px-2 py-0.5 rounded-full">{d.status}</span></td>
                            <td className="py-2.5 font-bold text-blue-600">{d.completeness_score}%</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  )}
                </div>
              </main>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
